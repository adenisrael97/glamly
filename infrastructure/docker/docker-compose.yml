services:
  postgres:
    image: postgres:16-alpine
    container_name: glamly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glamly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glamly_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-glamly}
    ports:
      # 5432 is taken by the host's local Postgres install; map to 5433 instead.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - glamly_internal
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glamly} -d ${POSTGRES_DB:-glamly}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: glamly_redis
    restart: unless-stopped
    # maxmemory-policy allkeys-lru: evict least-recently-used keys when full.
    # Without a policy Redis blocks on write once it hits the limit.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-glamly_redis_password}
      --maxmemory ${REDIS_MAXMEMORY:-128mb}
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - glamly_internal
    deploy:
      resources:
        limits:
          memory: 160M
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-glamly_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  glamly_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
