# Render.com IaC — Glamly full-stack deployment
# https://render.com/docs/yaml-spec
#
# Services provisioned:
#   glamly-api      — Node.js Express API (Docker build from apps/api/Dockerfile)
#   glamly-postgres — Managed PostgreSQL 16
#   glamly-redis    — Managed Redis
#
# First deploy: set sync: false secrets (PAYSTACK_*, VAPID_*, RESEND_API_KEY,
# CLOUDINARY_*, SENTRY_DSN) in the Render dashboard after running `render up`.

services:
  - type: web
    name: glamly-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    region: oregon
    plan: free

    envVars:
      # ── Runtime ─────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"

      # ── Database (auto-wired from managed Postgres below) ───────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: glamly-postgres
          property: connectionString

      # ── Redis (auto-wired from managed Redis below) ─────────────────────────
      - key: REDIS_URL
        fromService:
          type: redis
          name: glamly-redis
          property: connectionString

      # ── Auth (auto-generated 64-char secrets) ────────────────────────────────
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "30d"

      # ── CORS (update to your Vercel URL after first deploy) ─────────────────
      - key: CORS_ORIGINS
        value: "https://glamly.vercel.app"

      # ── Web app URL (used in emails and push notifications) ─────────────────
      - key: WEB_APP_URL
        value: "https://glamly.vercel.app"

      # ── Email ────────────────────────────────────────────────────────────────
      - key: EMAIL_FROM
        value: "Glamly <noreply@glamly.ng>"
      - key: RESEND_API_KEY
        sync: false

      # ── Payments ─────────────────────────────────────────────────────────────
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        value: "https://glamly.vercel.app/bookings"

      # ── Web Push (VAPID) ─────────────────────────────────────────────────────
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:noreply@glamly.ng"

      # ── Cloudinary ───────────────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Observability ────────────────────────────────────────────────────────
      - key: SENTRY_DSN
        sync: false

    healthCheckPath: /health

  - type: redis
    name: glamly-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: glamly-postgres
    plan: free
    databaseName: glamly
    user: glamly
    region: oregon
